<header class="section hero hero-split" id="top">
  <div class="hero-copy">
    <span class="eyebrow" data-sid="hero-eyebrow">{{heroEyebrow}}</span>
    <h1 class="display hero-title" data-sid="hero-title" data-split>{{name}}</h1>
    <p class="lede" data-sid="hero-tagline">{{tagline}}</p>
    <a class="btn btn-accent magnetic" data-sid="hero-cta" href="#items">
      {{heroCta}} <span class="btn-icon" aria-hidden="true">↓</span>
    </a>
  </div>
  <aside class="hero-card tilt">
    <div class="shell">
      <div class="core">
        <span class="label"><span class="pulse" aria-hidden="true"></span><span data-sid="hero-card-label">{{highlightLabel}}</span></span>
        <p class="hero-card-big" data-sid="hero-card-hours">{{hours}}</p>
        <div class="dash" aria-hidden="true"></div>
        <p class="muted" data-sid="hero-card-note">{{highlightNote}}</p>
      </div>
    </div>
  </aside>
</header>
