<section class="section visit visit-card" id="visit" data-reveal>
  <div class="shell">
    <div class="core visit-grid">
      <div>
        <span class="eyebrow" data-sid="visit-eyebrow">Come by</span>
        <h2 class="display h2" data-sid="visit-title">{{visitTitle}}</h2>
      </div>
      <dl class="details">
        <div><dt class="label">Hours</dt><dd data-sid="hours">{{hours}}</dd></div>
        <div><dt class="label">Address</dt><dd data-sid="address">{{address}}</dd></div>
      </dl>
    </div>
  </div>
</section>
