<section class="section visit visit-columns" id="visit" data-reveal>
  <h2 class="display visit-big" data-sid="visit-title">{{visitTitle}}</h2>
  <div class="visit-boxes">
    <div class="shell spotlight"><div class="core">
      <span class="label">Hours</span>
      <p class="visit-value" data-sid="hours">{{hours}}</p>
    </div></div>
    <div class="shell spotlight"><div class="core">
      <span class="label">Address</span>
      <p class="visit-value" data-sid="address">{{address}}</p>
    </div></div>
  </div>
</section>
