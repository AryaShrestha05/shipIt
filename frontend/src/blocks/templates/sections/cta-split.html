<section class="section cta cta-split" data-reveal>
  <div class="shell"><div class="core cta-split-inner">
    <h2 class="display h2" data-sid="cta-title">{{closingTitle}}</h2>
    <div class="cta-split-side">
      <p class="muted" data-sid="cta-tagline">{{tagline}}</p>
      <a class="btn btn-accent magnetic" data-sid="cta-button" href="#visit">
        {{visitTitle}} <span class="btn-icon" aria-hidden="true">→</span>
      </a>
    </div>
  </div></div>
</section>
