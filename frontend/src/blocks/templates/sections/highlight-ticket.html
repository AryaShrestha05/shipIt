<section class="section highlight highlight-ticket" data-reveal>
  <div class="shell">
    <div class="core ticket">
      <span class="label"><span class="pulse" aria-hidden="true"></span><span data-sid="highlight-label">{{highlightLabel}}</span></span>
      <p class="ticket-hours" data-sid="highlight-hours">{{hours}}</p>
      <p class="muted" data-sid="highlight-note">{{highlightNote}}</p>
    </div>
  </div>
</section>
