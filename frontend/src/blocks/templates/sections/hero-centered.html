<header class="section hero hero-centered" id="top">
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <span class="eyebrow" data-sid="hero-eyebrow">{{heroEyebrow}}</span>
  <h1 class="display hero-title" data-sid="hero-title" data-split>{{name}}</h1>
  <p class="lede" data-sid="hero-tagline">{{tagline}}</p>
  <div class="hero-actions">
    <a class="btn btn-accent magnetic" data-sid="hero-cta" href="#items">
      {{heroCta}} <span class="btn-icon" aria-hidden="true">↓</span>
    </a>
    <a class="btn btn-ghost" data-sid="hero-visit" href="#visit">{{visitTitle}}</a>
  </div>
</header>
